<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLOGRAPHIC DEMOLITION SIMULATOR</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-blue: #0044ff;
            --neon-red: #ff0055;
            --bg-dark: #05050a;
            --panel-bg: rgba(10, 10, 25, 0.75);
            --panel-border: rgba(0, 243, 255, 0.3);
            --font-tech: 'Orbitron', 'Rajdhani', 'Roboto Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: var(--font-tech);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* JARVIS HUD Overlay */
        .hud-element {
            position: absolute;
            z-index: 10;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1), inset 0 0 15px rgba(0, 243, 255, 0.05);
            transition: all 0.3s ease;
        }

        .hud-element:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.1);
        }

        /* Header / Title */
        header {
            top: 20px;
            left: 20px;
            width: calc(100% - 40px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--neon-cyan);
            padding-bottom: 10px;
            background: linear-gradient(90deg, rgba(0, 243, 255, 0.1) 0%, transparent 100%);
            pointer-events: none;
        }

        header h1 {
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            animation: pulse 2s infinite;
        }

        .system-status {
            font-size: 0.8rem;
            color: #8ab4f8;
            display: flex;
            gap: 20px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
        }

        .status-dot.pulsing {
            animation: pulse 1s infinite alternate;
        }

        /* Left Control Panel */
        #control-panel {
            top: 100px;
            left: 20px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-section {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .panel-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .panel-title {
            font-size: 0.9rem;
            color: var(--neon-cyan);
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        /* Buttons */
        .btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            color: #fff;
            padding: 10px 15px;
            font-family: var(--font-tech);
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--neon-cyan);
            font-weight: bold;
        }

        .btn-danger {
            border-color: var(--neon-red);
            background: rgba(255, 0, 85, 0.1);
        }

        .btn-danger:hover {
            background: var(--neon-red);
            border-color: var(--neon-red);
            box-shadow: 0 0 15px var(--neon-red);
            color: white;
        }

        /* Sliders */
        .slider-container {
            margin-bottom: 10px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #a0a0c0;
            margin-bottom: 5px;
        }

        .slider-label span:last-child {
            color: var(--neon-cyan);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--neon-cyan);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px var(--neon-cyan);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* Right Telemetry Panel */
        #telemetry-panel {
            top: 100px;
            right: 20px;
            width: 280px;
        }

        .telemetry-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 8px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            padding-bottom: 4px;
        }

        .telemetry-row span:first-child {
            color: #8ab4f8;
        }

        .telemetry-row span:last-child {
            font-weight: bold;
            color: var(--neon-cyan);
        }

        .telemetry-row.critical span:last-child {
            color: var(--neon-red);
            animation: blink 0.5s infinite alternate;
        }

        /* Bottom Instruction Bar */
        #instruction-bar {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 8px 20px;
            border-radius: 20px;
            background: rgba(5, 5, 15, 0.8);
            pointer-events: none;
            animation: pulse-border 3s infinite;
        }

        /* Crosshair for clicking */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            display: none; /* Dynamic */
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: var(--neon-cyan);
        }

        #crosshair::before { top: 4px; left: -10px; width: 30px; height: 2px; }
        #crosshair::after { top: -10px; left: 4px; width: 2px; height: 30px; }

        /* Sound Toggle */
        #audio-toggle {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Animations */
        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.3; transform: scale(0.9); }
        }

        @keyframes pulse-border {
            0% { border-color: rgba(0, 243, 255, 0.2); }
            50% { border-color: rgba(0, 243, 255, 0.6); }
            100% { border-color: rgba(0, 243, 255, 0.2); }
        }

        @keyframes blink {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
