<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX-IX 3D Structural Collapse Simulator</title>
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-blue: #0044ff;
            --neon-red: #ff0055;
            --bg-dark: #030712;
            --panel-bg: rgba(3, 7, 18, 0.85);
            --border-glow: 1px solid rgba(0, 240, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Sci-Fi HUD Overlay */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            grid-template-rows: 80px 1fr 180px;
            padding: 20px;
            gap: 20px;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Glow effects */
        .glow-text {
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 240, 255, 0.5);
        }
        .glow-text-red {
            text-shadow: 0 0 10px var(--neon-red), 0 0 20px rgba(255, 0, 85, 0.5);
        }

        /* Header */
        header {
            grid-column: 1 / span 3;
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.15) 0%, rgba(0,0,0,0) 100%);
            border-bottom: var(--border-glow);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .logo-area h1 {
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: var(--neon-cyan);
            font-weight: 900;
        }

        .logo-area p {
            font-size: 0.75rem;
            color: #64748b;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.85rem;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            background-color: var(--neon-cyan);
