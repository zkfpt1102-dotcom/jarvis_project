<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Structural Demolition Simulator</title>
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-blue: #0044ff;
            --neon-red: #ff0055;
            --bg-dark: #030712;
            --panel-bg: rgba(6, 18, 36, 0.85);
            --panel-border: rgba(0, 240, 255, 0.3);
            --font-tech: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-tech);
            color: #e2e8f0;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Scanline Overlay Effect */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.06),
                rgba(0, 255, 0, 0.02),
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 6px 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* HUD Overlay */
        .hud-panel {
            position: absolute;
            z-index: 10;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            transition: all 0.3s ease;
        }

        .hud-panel::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 10px;
            height: 10px;
            border-top: 2px solid var(--neon-cyan);
            border-left: 2px solid var(--neon-cyan);
        }

        .hud-panel::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 10px;
            height: 10px;
            border-bottom: 2px solid var(--neon-cyan);
            border-right: 2px solid var(--neon-cyan);
        }

        /* Top Left - Title & Status */
        #hud-title {
            top: 20px;
            left: 20px;
            width: 320px;
        }

        #hud-title h1 {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #hud-title h1::after {
            content: 'SYS.ACTIVE';
            font-size: 0.6rem;
            color: #10b981;
            border: 1px solid #10b981;
            padding: 2px 4px;
            border-radius: 3px;
            animation: pulse 1.5s infinite;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin: 6px 0;
            border-bottom: 1px dashed rgba(0, 240, 255, 0.1);
            padding-bottom: 4px;
        }

        .status-val {
            color: var(--neon-cyan);
            font-weight: bold;
        }

        /* Right Panel - Parameters & Controls */
        #hud-controls {
            top: 20px;
            right: 20px;
            width: 300px;
        }

        .section-title {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 4px;
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: block;
            font-size: 0.7rem;
            margin-bottom: 5px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .control-group input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: rgba(0, 240, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--neon-cyan);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        /* Interactive Buttons */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }

        .btn {
            background: rgba(0, 68, 255, 0.2);
            border: 1px solid var(--neon-blue);
            color: #fff;
            padding: 8px 12px;
            font-family: var(--font-tech);
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
            border-color: var(--neon-cyan);
        }

        .btn-danger {
            background: rgba(255, 0, 85, 0.15);
            border-color: var(--neon-red);
        }

        .btn-danger:hover {
            background: var(--neon-red);
            color: white;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
            border-color: var(--neon-red);
        }

        /* Bottom Center - Instructions */
        #hud-instructions {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            pointer-events: none;
            background: rgba(3, 7, 18, 0.7);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(0, 240, 255, 0.1);
        }

        .highlight {
            color: var(--neon-cyan);
            font-weight: bold;
        }

        /* Crosshair in Center */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            pointer-events: none;
            z-index: 5;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: var(--neon-cyan);
        }

        #crosshair::before {
            top: 14px;
            left: 0;
            width: 30px;
            height: 2px;
        }

        #crosshair::after {
            top: 0;
            left: 14px;
            width: 2px;
            height: 30px;
        }

        /* Structural Integrity Bar */
        .integrity-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        #integrity-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue));
            box-shadow: 0 0 8px var(--neon-cyan);
            transition: width 0.3s ease;
        }

        /* Warnings overlay */
        #warning-overlay {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            color: var(--neon-red);
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--neon-red);
            opacity: 0;
            transition: opacity 0.2s;
            text-transform: uppercase;
            border: 2px solid var(--neon-red);
            padding: 10px 20px;
            background: rgba(255, 0, 85, 0.1);
            border-radius: 4px;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Screen distortion / Glitch effect on collapse */
        .glitch-active {
            animation: glitch 0.15s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Responsive */
        @media(max-width: 768px) {
            .hud-panel {
                width: calc(100% - 40px) !important;
                left: 20px !important;
                right: 20px !important;
            }
            #hud-controls {
                top: auto;
                bottom: 80px;
            }
            #hud-instructions {
                display: none;
            }
        }
    </style>

    <!-- Import Maps Polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.19.0/dist/cannon-es.js"
        }
      }
    </script>
</head>
<body>
    <div class="scanlines"></div>
    <div id="canvas-container"></div>

    <!-- Center Aim Crosshair -->
    <div id="crosshair"></div>

    <!-- Alert Banner -->
    <div id="warning-overlay">STRUCTURAL COLLAPSE DETECTED</div>

    <!-- HUD Panel Left: Status -->
    <div id="hud-title" class="hud-panel">
        <h1>QUANTUM CORE</h1>
        <div class="status-row">
            <span>SIMULATION MODE:</span>
            <span class="status-val" id="val-mode">PHYSICS ACTIVE</span>
        </div>
        <div class="status-row">
            <span>STRUCTURAL INTEGRITY:</span>
            <span class="status-val" id="val-integrity">100%</span>
        </div>
        <div class="integrity-bar-container">
            <div id="integrity-bar"></div>
        </div>
        <div class="status-row" style="margin-top: 12px;">
            <span>ACTIVE ELEMENTS:</span>
            <span class="status-val" id="val-blocks">0 / 0</span>
        </div>
        <div class="status-row">
            <span>PARTICLE COUNT:</span>
            <span class="status-val" id="val-particles">0</span>
        </div>
        <div class="status-row">
            <span>FPS:</span>
            <span class="status-val" id="val-fps">60</span>
        </div>
    </div>

    <!-- HUD Panel Right: Controls -->
    <div id="hud-controls" class="hud-panel">
        <div class="section-title">CONTROL INTERFACE</div>
        
        <div class="control-group">
            <label for="building-type">BUILDING ARCHITECTURE</label>
            <select id="building-type" style="width:100%; background: rgba(0,240,255,0.1); border: 1px solid var(--neon-cyan); color: white; padding: 5px; font-family: var(--font-tech); outline: none;">
                <option value="tower">Skyscraper Grid (Dense)</option>
                <option value="slabs">Slab & Column Tower</option>
                <option value="pyramid">Holographic Pyramid</option>
                <option value="twin">Twin Pillars</option>
            </select>
        </div>

        <div class="control-group">
            <label for="slider-gravity">GRAVITY FORCE: <span id="lbl-gravity">-9.8 m/s²</span></label>
            <input type="range" id="slider-gravity" min="-20" max="0" step="0.5" value="-9.8">
        </div>

        <div class="control-group">
            <label for="slider-weapon">WEAPON CHARGE: <span id="lbl-weapon">50 GJ</span></label>
            <input type="range" id="slider-weapon" min="10" max="150" step="5" value="60">
        </div>

        <div class="control-group">
            <label for="slider-time">TIME DIALATION: <span id="lbl-time">1.0x</span></label>
            <input type="range" id="slider-time" min="0.1" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="btn-grid">
            <button class="btn" id="btn-reset">RESET MATRIX</button>
            <button class="btn btn-danger" id="btn-detonate">DETONATE BASE</button>
        </div>
        <div class="btn-grid" style="margin-top: 8px;">
            <button class="btn" id="btn-earthquake" style="grid-column: span 2; border-color: #ff9f00; color: #ff9f00; background: rgba(255,159,0,0.1)">TRIGGER SEISMIC WAVE</button>
        </div>
    </div>

    <!-- HUD Bottom Center: Quick Help -->
    <div id="hud-instructions">
        [CLICK / TAP] ON BUILDING TO FIRE <span class="highlight">PLASMA CHARGE</span> | [DRAG] ROTATE MATRIX | [SCROLL] ZOOM
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as CANNON from 'cannon-es';

        // --- GLOBAL SIMULATION STATE ---
        const state = {
            gravity: -9.8,
            weaponForce: 60,
            timeScale: 1.0,
            buildingType: 'tower',
            blocksCount: 0,
            originalVolume: 0,
            initialBlockY: [],
            isCollapsing: false,
            fps: 60,
            integrity: 100
        };

        // --- THREE.JS & CANNON.JS SETUP ---
        let scene, camera, renderer, controls;
        let world;
        const physicsBodies = []; // array containing { mesh, body, initialY }
        const particles = []; // Custom debris particle system pool
        const maxParticles = 500;
        let particleSystem;
        let particleGeom;
        let particlePositions;
        let particleColors;
        let particleData = [];

        // Frame timing
        let lastTime = performance.now();
        let frameCount = 0;
        let fpsTimer = 0;
