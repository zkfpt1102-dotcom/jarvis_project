<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS 3D Structural Collapse Simulation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --neon-cyan: #00f0ff;
            --neon-blue: #0072ff;
            --neon-red: #ff3e3e;
            --bg-dark: #020617;
            --panel-bg: rgba(3, 7, 18, 0.85);
            --border-glow: 1px solid rgba(0, 240, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Share Tech Mono', monospace;
            color: var(--neon-cyan);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Scanline effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* HUD Styling */
        .hud-panel {
            position: absolute;
            z-index: 5;
            background: var(--panel-bg);
            border: var(--border-glow);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .hud-panel::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; width: 10px; height: 10px;
            border-top: 2px solid var(--neon-cyan);
            border-left: 2px solid var(--neon-cyan);
        }

        .hud-panel::after {
            content: '';
            position: absolute;
            bottom: -2px; right: -2px; width: 10px; height: 10px;
            border-bottom: 2px solid var(--neon-cyan);
            border-right: 2px solid var(--neon-cyan);
        }

        /* Header HUD */
        #hud-header {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            border-bottom: var(--border-glow);
        }

        .system-title {
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .system-title span {
            color: #fff;
        }

        .status-tag {
            font-size: 0.85rem;
            padding: 4px 8px;
            border: 1px solid var(--neon-cyan);
            border-radius: 3px;
            animation: pulse 2s infinite;
        }

        /* Left Control Panel */
        #hud-controls {
            top: 100px;
            left: 20px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section-title {
            font-size: 1rem;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 5px;
            margin-bottom: 10px;
            letter-spacing: 1px;
            color: var(--neon-cyan);
            display: flex;
            justify-content: space-between;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.75rem;
            color: rgba(0, 240, 255, 0.7);
            display: flex;
            justify-content: space-between;
        }

        /* Custom Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: rgba(0, 240, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            outline: none
